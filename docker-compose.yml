version: '3.8'

services:
  flask_server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=test:app
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/study_app
    depends_on:
      - pgdb
    volumes:
      - .:/app
    command: python -m flask run --host=0.0.0.0

  pgdb:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=study_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U postgres"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - pgdb
volumes:
  postgres_data:
